<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Sign in</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--toolbar); color: var(--text); font: 13.5px/1.45 var(--font); }
    body { display: flex; flex-direction: column; padding: 22px 24px 20px; box-sizing: border-box; user-select: none; }
    h1 { margin: 0 0 4px; font: 600 17px var(--font-display); }
    .sub { color: var(--text-dim); margin: 0 0 16px; font-size: 12.5px; word-break: break-all; }
    label.f { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 0 0 10px; }
    input[type=text], input[type=password] {
      display: block; width: 100%; box-sizing: border-box; margin-top: 5px; height: 34px; padding: 0 10px;
      border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); color: var(--text); font: inherit; user-select: text;
    }
    input:focus { outline: 2px solid var(--accent-ring); border-color: var(--accent); }
    .remember { display: flex; align-items: center; gap: 8px; margin: 2px 0 0; color: var(--text-dim); font-size: 12.5px; }
    .actions { margin-top: auto; display: flex; justify-content: flex-end; gap: 10px; }
    button { height: 34px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: 600 13px var(--font); }
    button:hover { background: var(--surface-hover); }
    button.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <p class="sub" id="who"></p>
  <label class="f">Username<input id="user" type="text" autocomplete="off" spellcheck="false" /></label>
  <label class="f">Password<input id="pass" type="password" autocomplete="off" /></label>
  <label class="remember" id="remember-row" hidden><input type="checkbox" id="remember" checked /> Save this login in Vexa</label>
  <div class="actions">
    <button id="cancel">Cancel</button>
    <button id="ok" class="primary">Sign in</button>
  </div>
  <script src="auth.js"></script>
</body>
</html>
