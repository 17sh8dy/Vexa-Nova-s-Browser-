<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<defs>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
<filter id="softer" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .07 0"/></filter>

</defs>
<rect width="1920" height="1080" fill="#fdf6f0"/>
<circle cx="420" cy="360" r="420" fill="#fecdd3" opacity="0.95" filter="url(#soft)"/>
<circle cx="1380" cy="300" r="400" fill="#e9d5ff" opacity="0.95" filter="url(#soft)"/>
<circle cx="1100" cy="820" r="460" fill="#fed7aa" opacity="0.8" filter="url(#soft)"/>
<circle cx="380" cy="900" r="320" fill="#fbcfe8" opacity="0.8" filter="url(#soft)"/>
<circle cx="900" cy="520" r="260" fill="#ddd6fe" opacity="0.7" filter="url(#soft)"/>
<rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
