<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Downloads</title>
  <link rel="stylesheet" href="vexa://shared/theme.css" />
  <link rel="stylesheet" href="vexa://shared/page.css" />
  <link rel="stylesheet" href="vexa://shared/list.css" />
  <link rel="stylesheet" href="downloads.css" />
</head>
<body>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="page-head">
        <h1>Downloads</h1>
        <label class="search"><span id="search-ico"></span><input id="q" type="text" placeholder="Search downloads" spellcheck="false" /></label>
      </div>
      <div class="toolbar-row">
        <div class="spacer"></div>
        <button class="btn small" id="open-folder">Open downloads folder</button>
        <button class="btn small" id="clear">Clear list</button>
      </div>
      <div id="list"></div>
    </main>
  </div>
  <script src="vexa://shared/icons.js"></script>
  <script src="vexa://shared/page.js"></script>
  <script src="downloads.js"></script>
</body>
</html>
